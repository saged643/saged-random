        body {

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        
        /* Pointer Arrow Bounce Animation */
        @keyframes pulse-pointer {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }
        .pointer-anim {
            animation: pulse-pointer 1.5s infinite ease-in-out;
        }

                tagline: "Glücksrad & Zufallsauswahl",
                settingsBtn: "Einstellungen",
                spinBtn: "Drehen!",
                instructions: "Klicke auf 'Drehen!', um einen Gewinner zu wählen",
                listTitle: "Teilnehmerliste",
                namePlaceholder: "Name eingeben...",
                addBtn: "Hinzufügen",
                shuffleBtn: "Mischen",
                clearBtn: "Alles löschen",

                soundTitle: "Soundeffekte",

                continueBtn: "Weiter",

            }
        };

        // Modern Vibrant Color Palette for Wheel Slices
        const sliceColors = [
            '#6366f1', '#ec4899', '#8b5cf6', '#10b981',
            '#f59e0b', '#06b6d4', '#f43f5e', '#3b82f6',
            '#14b8a6', '#a855f7', '#eab308', '#ef4444'
        ];

        /* -------------------------------------------------------------
         * Global Application State Variables
         * ------------------------------------------------------------- */
        let names = ["ساجد", "أحمد", "مريم", "سارة", "محمد", "عمر"];
        let currentLang = 'ar';
        let soundEnabled = true;
        let isSpinning = false;
        
        let startAngle = 0;
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let currentWinnerIndex = -1;

        // Audio Context setup using Web Audio API (No external sound files required)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        function playVictorySound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
                    
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.12);
                    osc.stop(audioCtx.currentTime + idx * 0.12 + 0.3);
                });
            } catch(e) {}
        }

        /* -------------------------------------------------------------
         * Wheel Canvas Rendering Engine
         * ------------------------------------------------------------- */
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');

        function drawWheel() {
            if (!ctx) return;
            
            const width = canvas.width;
            const height = canvas.height;
            const outsideRadius = width / 2 - 20;
            const textRadius = outsideRadius * 0.68;
            const insideRadius = 80;

            ctx.clearRect(0, 0, width, height);

            if (names.length === 0) {
                // Empty Wheel State
                ctx.save();
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, outsideRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#94a3b8';
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px Cairo, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(i18n[currentLang].emptyWheelText, width / 2, height / 2);
                ctx.restore();
                return;
            }

            const arc = Math.PI / (names.length / 2);

            for (let i = 0; i < names.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = sliceColors[i % sliceColors.length];

                // Slice Arc
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, outsideRadius, angle, angle + arc, false);
                ctx.arc(width / 2, height / 2, insideRadius, angle + arc, angle, true);
                ctx.fill();

                // Slice Divider Lines
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Slice Text Rendering
                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.translate(
                    width / 2 + Math.cos(angle + arc / 2) * textRadius,
                    height / 2 + Math.sin(angle + arc / 2) * textRadius
                );
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                
                let text = names[i];
                if (text.length > 14) text = text.substring(0, 12) + '...';
                
                ctx.font = 'bold 28px Cairo, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 0, 0);
                ctx.restore();
            }
        }

        /* -------------------------------------------------------------
         * Spin Motion & Animation Loop
         * ------------------------------------------------------------- */
        let lastTickAngle = 0;

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }

            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            
            // Play tick sound when passing a slice boundary
            const arc = Math.PI / (names.length / 2);
            if (Math.abs(startAngle - lastTickAngle) >= arc) {
                playTickSound();
                lastTickAngle = startAngle;
            }

            drawWheel();
            spinTimeout = requestAnimationFrame(rotateWheel);
        }

        function stopRotateWheel() {
            cancelAnimationFrame(spinTimeout);
            isSpinning = false;

            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = (Math.PI / (names.length / 2)) * 180 / Math.PI;
            let index = Math.floor((360 - (degrees % 360)) / arcd) % names.length;
            if (index < 0) index += names.length;

            currentWinnerIndex = index;
            const winner = names[index];
            handleWinner(winner);
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        function startSpin() {
            if (isSpinning || names.length === 0) return;
            initAudio();
            isSpinning = true;
            spinAngleStart = Math.random() * 10 + 20;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            lastTickAngle = startAngle;
            rotateWheel();
        }

        /* -------------------------------------------------------------
         * Winner Celebration & Confetti Logic
         * ------------------------------------------------------------- */
        function handleWinner(winner) {
            playVictorySound();
            fireConfetti();

            document.getElementById('winner-name-display').textContent = winner;
            const winnerModal = document.getElementById('winner-modal');
            winnerModal.classList.remove('opacity-0', 'pointer-events-none');
            winnerModal.children[0].classList.remove('scale-95');
            winnerModal.children[0].classList.add('scale-100');
        }

        function hideWinnerModal() {
            const winnerModal = document.getElementById('winner-modal');
            winnerModal.children[0].classList.remove('scale-100');
            winnerModal.children[0].classList.add('scale-95');
            winnerModal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Pure Canvas Confetti Effect
        function fireConfetti() {
            const cCanvas = document.getElementById('confetti-canvas');
            const cCtx = cCanvas.getContext('2d');
            cCanvas.width = window.innerWidth;
            cCanvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6'];

            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: cCanvas.width / 2,
                    y: cCanvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 16,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 120
                });
            }

            function animateConfetti() {
                cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.25; // gravity
                        p.life--;
                        cCtx.fillStyle = p.color;
                        cCtx.beginPath();
                        cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        cCtx.fill();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
                }
            }
            animateConfetti();
        }

        /* -------------------------------------------------------------
         * Name Management & UI Renderers
         * ------------------------------------------------------------- */
        function renderNamesList() {
            const container = document.getElementById('names-list-container');
            const countBadge = document.getElementById('names-count');
            container.innerHTML = '';

            countBadge.textContent = `${names.length} ${names.length === 1 ? 'اسم' : 'أسماء'}`;

            names.forEach((name, index) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800/80 text-sm font-semibold transition-all hover:border-indigo-300 dark:hover:border-indigo-800';
                
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden pr-2">
                        <span class="w-2 h-2 rounded-full" style="background-color: ${sliceColors[index % sliceColors.length]}"></span>
                        <span class="truncate">${name}</span>
                    </div>
                    <button onclick="removeName(${index})" class="text-slate-400 hover:text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-all">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(item);
            });

            drawWheel();
        }

        function addName(name) {
            const trimmed = name.trim();
            if (!trimmed) return;
            names.push(trimmed);
            renderNamesList();
        }

        function removeName(index) {
            if (index >= 0 && index < names.length) {
                names.splice(index, 1);
                renderNamesList();
            }
        }

        /* -------------------------------------------------------------
         * Internationalization (i18n) & Language Switcher
         * ------------------------------------------------------------- */
        function applyLanguage(langKey) {
            if (!i18n[langKey]) return;
            currentLang = langKey;
            const dict = i18n[langKey];

            // Set Document Direction (RTL / LTR)
            document.documentElement.dir = dict.dir;
            document.documentElement.lang = langKey;

            // Translate Text Elements
            document.getElementById('txt-tagline').textContent = dict.tagline;
            document.getElementById('txt-settings-btn').textContent = dict.settingsBtn;
            document.getElementById('txt-spin-btn').textContent = dict.spinBtn;
            document.getElementById('txt-instructions').textContent = dict.instructions;
            document.getElementById('txt-list-title').textContent = dict.listTitle;
            document.getElementById('input-name').placeholder = dict.namePlaceholder;
            document.getElementById('txt-add-btn').textContent = dict.addBtn;
            document.getElementById('txt-shuffle').textContent = dict.shuffleBtn;
            document.getElementById('txt-clear').textContent = dict.clearBtn;
            document.getElementById('txt-load-defaults').textContent = dict.loadDefaultsBtn;
            document.getElementById('txt-settings-title').textContent = dict.settingsTitle;
            document.getElementById('txt-lang-label').textContent = dict.langLabel;
            document.getElementById('txt-sound-title').textContent = dict.soundTitle;
            document.getElementById('txt-sound-desc').textContent = dict.soundDesc;
            document.getElementById('txt-save-btn').textContent = dict.saveBtn;
            document.getElementById('txt-winner-header').textContent = dict.winnerHeader;
            document.getElementById('txt-continue-btn').textContent = dict.continueBtn;
            document.getElementById('txt-remove-winner-btn').textContent = dict.removeWinnerBtn;

            // Update Active Language Button Styles
            document.querySelectorAll('#lang-options .lang-btn').forEach(btn => {
                if (btn.getAttribute('data-lang') === langKey) {
                    btn.className = 'lang-btn p-3 rounded-xl border text-sm font-bold flex items-center justify-between border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400';
                } else {
                    btn.className = 'lang-btn p-3 rounded-xl border text-sm font-bold flex items-center justify-between border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300';
                }
            });

            drawWheel();
        }

        /* -------------------------------------------------------------
         * Event Listeners & Initialization
         * ------------------------------------------------------------- */
        document.getElementById('form-add-name').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('input-name');
            addName(input.value);
            input.value = '';
        });

        document.getElementById('btn-spin-center').addEventListener('click', startSpin);
        document.getElementById('wheel-canvas').addEventListener('click', startSpin);

        document.getElementById('btn-shuffle').addEventListener('click', () => {
            names.sort(() => Math.random() - 0.5);
            renderNamesList();
        });

        document.getElementById('btn-clear-all').addEventListener('click', () => {
            names = [];
            renderNamesList();
        });

        document.getElementById('btn-load-defaults').addEventListener('click', () => {
            names = ["ساجد", "أحمد", "مريم", "سارة", "محمد", "عمر"];
            renderNamesList();
        });

        // Winner Modal Buttons
        document.getElementById('btn-winner-continue').addEventListener('click', () => {
            hideWinnerModal();
        });

        document.getElementById('btn-winner-remove').addEventListener('click', () => {
            if (currentWinnerIndex >= 0 && currentWinnerIndex < names.length) {
                removeName(currentWinnerIndex);
                currentWinnerIndex = -1;
            }
            hideWinnerModal();
        });

        // Settings Modal Open/Close
        const settingsModal = document.getElementById('settings-modal');
        document.getElementById('btn-open-settings').addEventListener('click', () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsModal.children[0].classList.remove('scale-95');
            settingsModal.children[0].classList.add('scale-100');
        });

        function closeSettings() {
            settingsModal.children[0].classList.remove('scale-100');
            settingsModal.children[0].classList.add('scale-95');
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
        }

        document.getElementById('btn-close-settings').addEventListener('click', closeSettings);
        document.getElementById('btn-save-settings').addEventListener('click', closeSettings);

        // Language Selectors Inside Settings
        document.querySelectorAll('#lang-options .lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                applyLanguage(lang);
            });
        });

        // Toggle Sound Setting
        document.getElementById('toggle-sound').addEventListener('change', (e) => {
            soundEnabled = e.target.checked;
        });

        // Toggle Dark/Light Theme
        document.getElementById('btn-theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // App Initialization
        window.addEventListener('load', () => {
            renderNamesList();
            applyLanguage('ar');
        });
    </script>
</body>
</html>
